name: probe
# Records how a public meeting corpus is laid out, so the accuracy benchmark can read it.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: NOTSOFAR layout
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, sys
          API = "https://huggingface.co/api/datasets/microsoft/NOTSOFAR/tree/main/"
          RES = "https://huggingface.co/datasets/microsoft/NOTSOFAR/resolve/main/"
          def tree(path, recursive=False):
              url = API + urllib.parse.quote(path) + "?limit=1000" + ("&recursive=true" if recursive else "")
              out = []
              while url:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      out += json.load(r)
                      link = r.headers.get("Link") or ""
                  m = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = m.group(1) if m else None
              return out
          log = open("out/notsofar-layout.txt", "w")
          def p(*a):
              print(*a); print(*a, file=log)
          for top in ["benchmark-datasets", "benchmark-datasets/dev_set", "benchmark-datasets/eval_set", "benchmark-datasets/train_set"]:
              try: p(top, "->", [e["path"].split("/")[-1] for e in tree(top)])
              except Exception as e: p(top, "ERROR", e)
          for subset in ["benchmark-datasets/dev_set/240825.1_dev1", "benchmark-datasets/eval_set/240629.1_eval_small_with_GT", "benchmark-datasets/eval_set/240825.1_eval_full_with_GT"]:
              try:
                  mt = tree(subset + "/MTG")
                  ids = [e["path"].split("/")[-1] for e in mt]
                  p(subset, len(ids), "meetings", ids[:8], "...")
                  one = tree(subset + "/MTG/" + ids[0], recursive=True)
                  for e in one: p("   ", e["type"], e["path"].split("/MTG/")[1], e.get("size"))
                  for name in ["gt_transcription.json", "gt_meeting_metadata.json", "devices.json"]:
                      try:
                          with urllib.request.urlopen(RES + urllib.parse.quote(subset + "/MTG/" + ids[0] + "/" + name), timeout=60) as r:
                              text = r.read().decode("utf-8", "replace")
                          p("==", name, len(text), "bytes"); p(text[:2500])
                      except Exception as e: p("==", name, "ERROR", e)
              except Exception as e: p(subset, "ERROR", e)
          PY
      - name: Publish
        if: always()
        run: scripts/ci_publish.sh out ci-probe
