name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Repository variable, optional: the bundle identifier to build the app with (see scripts/ci_xcodebuild.sh).
  MINUTES_BUNDLE_ID: ${{ vars.MINUTES_BUNDLE_ID }}
jobs:
  core:
    name: Core logic and mail
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          mkdir -p out
          cd Packages/MinutesCore
          set -o pipefail
          swift test 2>&1 | tee ../../out/core-tests.log | grep -E "error|failed|Executed|warning: unre" || true
          grep -q "with 0 failures" ../../out/core-tests.log && ! grep -q "error:" ../../out/core-tests.log
      - name: Mail code against a real SMTP server
        run: |
          # The system Python (3.9) is used on purpose: the SMTP test server library predates Python 3.14.
          /usr/bin/python3 -m venv /tmp/venv && /tmp/venv/bin/pip -q install aiosmtpd
          /tmp/venv/bin/python scripts/smtp_integration.py Packages/MinutesCore 2>&1 | tee out/smtp-integration.log | grep -E "PASS|FAIL|checks passed"
          grep -q "13/13 checks passed" out/smtp-integration.log
      - name: Encrypted connection to Gmail
        run: |
          cd Packages/MinutesCore
          MINUTES_LIVE_SMTP=1 swift test --filter NetworkTransportTests 2>&1 | tee ../../out/live-smtp.log | grep -E "error|passed|failed|Executed" || true
          grep -q "Executed 3 tests, with 0 failures" ../../out/live-smtp.log
      - name: Publish results
        if: always()
        run: scripts/ci_publish.sh out ci-core

  speech:
    name: Speech pipeline on a synthetic meeting
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/FluidAudio
          key: speech-models-ultra-v1
      - uses: actions/cache@v4
        with:
          path: Packages/MinutesSpeech/.build
          key: speech-build-${{ hashFiles('Packages/MinutesSpeech/Package.swift') }}
      - name: Build the benchmark tool
        run: |
          mkdir -p out
          cd Packages/MinutesSpeech
          set -o pipefail
          swift build -c release --product minutes-bench 2>&1 | tee ../../out/speech-build.log | grep -E "error|Compiling MinutesSpeech|complete!" || true
          test -x .build/release/minutes-bench
      - name: Make a six-person test meeting with crosstalk
        run: python3 scripts/make_test_meeting.py out 2>&1 | tee out/make-meeting.log
      - name: Run the pipeline
        run: |
          set -o pipefail
          Packages/MinutesSpeech/.build/release/minutes-bench out/meeting.wav --out out/result.json 2>&1 | tee out/bench.log | tail -8
      - name: Score
        run: python3 scripts/score_meeting.py out/result.json out/meeting.ref.json --json out/score.json | tee out/score.log
      - name: Publish results
        if: always()
        run: |
          rm -f out/meeting.wav
          scripts/ci_publish.sh out ci-speech

  app:
    name: iPhone app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/spm
          key: app-packages-${{ hashFiles('Packages/MinutesSpeech/Package.swift') }}
      - name: Generate the Xcode project
        run: |
          mkdir -p out
          brew install xcodegen > /dev/null 2>&1 || brew install xcodegen
          xcodegen generate 2>&1 | tee out/xcodegen.log
      - name: Build for the simulator
        run: scripts/ci_xcodebuild.sh sim
      - name: Build for iPhone
        run: scripts/ci_xcodebuild.sh device
      - name: Package the app
        run: scripts/ci_package.sh
      - name: Photograph every screen
        timeout-minutes: 20
        run: scripts/ci_screenshots.sh
      - name: Whole app, end to end, in the simulator
        if: success() || failure()
        timeout-minutes: 35
        run: |
          set -o pipefail
          test -d build/sim/Build/Products/Debug-iphonesimulator/Minutes.app
          /usr/bin/python3 -m venv /tmp/venv && /tmp/venv/bin/pip -q install aiosmtpd
          python3 scripts/make_test_meeting.py build/e2e > out/e2e-make.log 2>&1
          /tmp/venv/bin/python scripts/e2e_app.py build/e2e/meeting.wav build/e2e/meeting.ref.json out 2>&1 | tee out/e2e.log
      - name: Whole app, end to end, as a live recording
        if: success() || failure()
        timeout-minutes: 25
        run: |
          set -o pipefail
          test -d build/sim/Build/Products/Debug-iphonesimulator/Minutes.app
          /tmp/venv/bin/python scripts/e2e_app.py build/e2e/meeting.wav build/e2e/meeting.ref.json out live 2>&1 | tee out/e2e-live.log
      - name: Publish the installable app
        # Only after everything above has passed, including the end-to-end run.
        run: scripts/ci_package.sh --release
      - name: Publish results
        if: always()
        run: scripts/ci_publish.sh out ci-app
